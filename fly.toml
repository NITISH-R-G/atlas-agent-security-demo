app = "atlas-security-demo"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "openai/gpt-oss-120b"
  ATLAS_AUDIT_STDOUT = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # In-memory approvals and audit require exactly one always-on instance.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
