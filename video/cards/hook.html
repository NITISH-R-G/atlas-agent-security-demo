<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Atlas</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020}
  body{font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#fff;display:grid;place-items:center;text-align:center;
    background:radial-gradient(1200px 700px at 75% 15%,rgba(79,140,255,.25),transparent 60%),radial-gradient(900px 600px at 10% 95%,rgba(40,200,190,.14),transparent 60%),#0b1020}
  .l{font-size:4.6vw;font-weight:650;letter-spacing:-.02em;margin:0;opacity:0;transform:translateY(1vw)}
  .l1{animation:up 1s .6s forwards}
  .l2{color:#8db4ff;animation:up 1s 3.2s forwards;margin-top:1.2vw}
  .brand{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:in 1s 9s forwards;background:inherit}
  .logo{width:7vw;height:7vw;border-radius:2.2vw;display:grid;place-items:center;font-size:3.8vw;font-weight:700;margin:0 auto 2vw;background:linear-gradient(135deg,#3b6cff,#27c4d6);box-shadow:0 1vw 3.4vw rgba(60,110,255,.5)}
  .name{font-size:5vw;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:2vw;color:#aab6d3;margin-top:1.2vw}
  @keyframes in{to{opacity:1}}
  @keyframes up{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important}}
</style></head>
<body><div><p class="l l1">An AI can suggest an action.</p><p class="l l2">Who decides if it happens?</p></div>
<div class="brand"><div><div class="logo">A</div><div class="name">Atlas</div><div class="sub">An AI assistant that checks before it acts</div></div></div>
</body></html>
