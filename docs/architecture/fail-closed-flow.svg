<g data-id="e5" data-step="5"><path d="M1135 420 L1135 540" pathLength="1" class="edge dashed" stroke="#c3c9d6" marker-end="url(#arrow-muted)"/></g>
<g data-id="e6" data-step="6"><path d="M1135 420 L1135 480 L640 480 L640 540" pathLength="1" class="edge dashed" stroke="#1f9d57" marker-end="url(#arrow-allow)"/></g>
<g data-id="n1" data-step="6"><text x="50" y="748" class="note" font-size="24" text-anchor="start" fill="#1e2a8c">A controlled, simulated failure. With Security OFF the same outage fails open: that is the defined weakness.</text></g>
